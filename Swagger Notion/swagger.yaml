          type: number
        type: array
      startTime:
        description: 图表下方X轴的开始时间
        type: string
    type: object
  api.DataChunkPostParam:
    properties:
      annotationsUrl:
        description: 注释文件URL（可选）
        example: https://example.com/annotations.json
        type: string
      deviceId:
        description: 设备ID
        example: device123
        type: string
      finish:
        description: 数据结束时间戳（毫秒，13位）
        example: 1695978000000
        type: integer
      isRepush:
        description: 是否为补推送（可选）
        example: false
        type: boolean
      rawDataUrl:
        description: 原始数据文件URL
        example: https://example.com/rawdata.csv
        type: string
      sessionId:
        description: 会话ID
        example: session456
        type: string
      start:
        description: 数据起始时间戳（毫秒，13位）
        example: 1695974400000
        type: integer
      type:
        description: 数据类型，可选值：EcgRaw、SpO2Raw、BPRaw、TemperatureRaw、GlucoseRaw
        example: EcgRaw
        type: string
    type: object
  api.DataChunkReturnData:
    properties:
      _id:
        example: 64b01f2c8f5a4b7d9c3e1234
        type: string
      annotationsUrl:
        example: https://example.com/annotations.json
        type: string
      clinic:
        example: Main Clinic
        type: string
      createdAt:
        description: 创建时间
        example: "2025-10-09T08:00:00Z"
        type: string
      dataType:
        example: EcgRaw
        type: string
      device:
        example: device123
        type: string
      duration:
        example: 10m0s
        type: string
      finish:
        example: "2025-10-09T08:10:00Z"
        type: string
      info:
        properties:
          chartAllLength:
            example: "600"
            type: string
          chartFileSize:
            example: 10MB
            type: string
          chartFinish:
            example: "2025-10-09T08:10:00Z"
            type: string
          chartStart:
            example: "2025-10-09T08:00:00Z"
            type: string
          chartTopLength:
            example: "600"
            type: string
          events:
            example: 20
            type: integer
          eventsFileSize:
            example: 2MB
            type: string
          eventsFinish:
            example: "2025-10-09T08:09:00Z"
            type: string
          eventsStart:
            example: "2025-10-09T08:01:00Z"
            type: string
          flaggedEvents:
            example: 2
            type: integer
          matchedEvents:
            example: 18
            type: integer
          stepEcgChartDur:
            example: "600"
            type: string
          stepEcgEventsDur:
            example: 8m0s
            type: string
        type: object
      patient:
        example: John Doe
        type: string
      rawDataUrl:
        example: https://example.com/raw.csv
        type: string
      session:
        properties:
          _id:
            example: 64b01f2c8f5a4b7d9c3e0001
            type: string
          finish:
            example: "2025-10-09T09:00:00Z"
            type: string
          start:
            example: "2025-10-09T07:00:00Z"
            type: string
        type: object
      start:
        example: "2025-10-09T08:00:00Z"
        type: string
      status:
        example: received
        type: string
      step:
        example: ecg
        type: string
      updatedAt:
        description: 更新时间
        example: "2025-10-09T08:30:00Z"
        type: string
    type: object
  api.DgpDataItem:
