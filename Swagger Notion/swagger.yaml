  api.RoleReturnData:
    properties:
      _id:
        description: 角色ID
        example: 64b01f2c8f5a4b7d9c3e1234
        type: string
      name:
        description: 角色名称
        example: Program Manager
        type: string
    type: object
  api.SaveParam:
    properties:
      key:
        description: 短链key，不能包含特殊字符
        example: my-short-key
        type: string
      url:
        description: 目标URL，必须为合法URL
        example: https://example.com
        type: string
    required:
    - key
    - url
    type: object
  api.SitePatchParam:
    properties:
      address:
        description: 地址
        example: 456 Center Rd
        type: string
      countryCode:
        description: 国家代码 (ISO 3166-1 alpha-2)
        example: US
        type: string
      description:
        description: 描述 (1-1000)
        example: Updated desc
        type: string
      id:
        description: 站点ID
        example: 64b01f2c8f5a4b7d9c3e1111
        type: string
      name:
        description: 站点名称 (1-40)
        example: Site A2
