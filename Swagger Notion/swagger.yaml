  api.PatientParamPost:
    description: 创建患者所需的字段；当 clinic.SubjectIdStatus=true 时，必须提供 internalId(SubjectId)。
    properties:
      birthDate:
        description: 出生日期(YYYY-MM-DD)
        example: "1990-05-20"
        type: string
      codes:
        description: 标签/编码（非 DCT 模式下）
        example:
        - '["CODE1"'
        - '"CODE2"]'
        items:
          type: string
        type: array
      firstName:
        description: 名
        example: John
        type: string
      gender:
        description: '性别: Male, Female, Non-Binary'
        example: Male
        type: string
      height:
        description: 身高 cm (0.0-999.9, 一位小数)
        example: 175
        type: number
      internalId:
        description: Subject ID (受试者编号)
        example: SUBJ-001
        type: string
      isOpenPrescribingPhysician:
        description: 是否开启配方医生
        example: true
        type: boolean
      isRpm:
        description: 是否标记为RPM病人
        example: false
        type: boolean
      lastName:
