      physician:
        description: 指派医生ID
        example: 665f0f1a2c3d4e5f6a7b8c9d
        type: string
      prescribingPhysicianName:
        description: 配方医生名称
        example: Dr. Smith
        type: string
      rpmGroupIds:
        description: RPM分组ID列表
        example:
        - '["665f0f1a2c3d4e5f6a7b8c9d"]'
        items:
          type: string
        type: array
      site:
        description: 站点ID
        example: 665f0f1a2c3d4e5f6a7b8c9d
        type: string
      thirdPartyNotification:
        description: 第三方通知列表(最多5个)
        items:
          $ref: '#/definitions/api.thirdPartyNotification'
        type: array
      timeZoneName:
        description: 时区名称 (IANA)
        example: Asia/Shanghai
        type: string
      weight:
        description: 体重 kg (0.0-999.9, 一位小数)
        example: 70.5
        type: number
    type: object
  api.PatientReturnData:
    properties:
      _id:
