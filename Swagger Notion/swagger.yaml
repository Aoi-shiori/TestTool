  api.SiteReturnData:
    properties:
      _id:
        description: 站点ID（同 id）
        example: 64b01f2c8f5a4b7d9c3e1111
        type: string
      address:
        description: 地址
        example: 123 Main St, NY
        type: string
      countryCode:
        description: 2位字母国家代码
        example: US
        type: string
      createdAt:
        description: 创建时间
        example: "2025-10-09T08:00:00Z"
        type: string
      description:
        description: 描述
        example: Main site
        type: string
      id:
        description: 站点ID
        example: 64b01f2c8f5a4b7d9c3e1111
        type: string
      name:
        description: 站点名称
        example: Site A
        type: string
      patientCount:
        description: 患者数量
        example: 12
        type: integer
      pm:
        description: Program Manager 列表(逗号分隔)
        example: Alice Smith,Bob Lee
        type: string
      studies:
        description: 所属研究(逗号分隔)
        example: Study1,Study2
        type: string
      updatedAt:
        description: 更新时间
        example: "2025-10-09T09:00:00Z"
        type: string
