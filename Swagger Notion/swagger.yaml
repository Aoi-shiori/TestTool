      monitoringProtocolId:
        description: 监测协议ID
        example: 64b01f2c8f5a4b7d9c3e1001
        type: string
      name:
        description: 研究名称 (1-100)
        example: Heart Study A
        type: string
      phase:
        description: 实验期数
        example: 1
