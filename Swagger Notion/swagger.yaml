  api.GlobalEnums:
    properties:
      event_actions:
        items:
          $ref: '#/definitions/model.EventActionEnum'
        type: array
      event_status:
        items:
          $ref: '#/definitions/model.EventStatusEnum'
        type: array
    type: object
  api.GtdChartItem:
