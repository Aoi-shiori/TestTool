      physician:
        $ref: '#/definitions/api.commonpPhysician'
      prescribingPhysicianName:
        type: string
      rpmGroupIds:
        description: RPM Group
        items:
          type: string
        type: array
      rpmGroups:
        description: RPM Group
        items:
          $ref: '#/definitions/api.rpmGroupData'
        type: array
      selfDefinedProtocol:
        description: 自定义协议
        type: boolean
      site:
        type: string
      siteName:
        type: string
      studiesList:
        items:
          $ref: '#/definitions/api.studiesData'
        type: array
      subjectId:
        type: string
      thirdPartyNotification:
        description: 第三方通知邮箱
        items:
          $ref: '#/definitions/api.thirdPartyNotification'
        type: array
      timeZoneName:
        description: 时区名称,IANA时区数据库,例:Asia/Shanghai
        type: string
