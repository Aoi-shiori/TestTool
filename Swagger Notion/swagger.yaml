        type: string
      id:
        description: 研究ID
        example: 64b01f2c8f5a4b7d9c3e2222
        type: string
      monitoringProtocolId:
        description: 监测协议ID
        example: 64b01f2c8f5a4b7d9c3e1002
        type: string
      name:
        description: 研究名称 (1-100)
