basePath: /
definitions:
  api.AgpDataItem:
    properties:
      percentile25Value:
        type: number
      percentile50Value:
        type: number
      percentile5Value:
        type: number
      percentile75Value:
        type: number
      percentile95Value:
        type: number
      x:
        type: string
    type: object
  api.AgpReturnData:
    properties:
      data:
        description: 绘图原始数据
        items:
          $ref: '#/definitions/api.AgpDataItem'
        type: array
      dataTimeZoneOffset:
        description: 数据时区偏移量,分钟
        type: integer
      endTime:
        description: 图表下方X轴的结束时间
        type: string
      percentileData:
        description: 百分位位置数据
        items:
          type: number
        type: array
      percentileSourceData:
        description: 百分位位置数据（原始点）
