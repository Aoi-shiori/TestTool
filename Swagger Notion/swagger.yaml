        example: 123 Main St
        type: string
      countryCode:
        description: 国家代码 (ISO 3166-1 alpha-2)
        example: US
        type: string
      description:
        description: 描述 (1-1000)
        example: Primary research site
        type: string
      name:
        description: 站点名称 (1-40)
        example: Site A
