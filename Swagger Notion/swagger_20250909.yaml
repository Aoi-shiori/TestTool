info:
  contact: {}
  description: vivalink API接口文档
  termsOfService: http://webportal.vivalink.com
  title: vivalink API接口文档
  version: "1.0"
paths:
  /authentication:
    post:
      consumes:
      - application/json
      description: 使用邮箱和密码进行认证，返回 accessToken 与用户信息
      parameters:
      - description: 登录参数
        in: body
        name: param
        required: true
        schema:
          $ref: '#/definitions/api.authParam'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功，返回 Token 与用户信息
          schema:
            $ref: '#/definitions/api.authReturnData'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/data.ReturnData'
        "500":
          description: 服务器内部错误
          schema:
            type: string
      summary: 用户登录
      tags:
      - User
  /bpData:
    get:
      consumes:
      - application/json
      description: 分页获取指定患者的血压数据，支持按输入类型筛选，返回数据包含时区信息
      parameters:
      - description: 跳过记录数（分页）
        example: 0
        in: query
        name: $skip
        type: integer
      - description: 每页记录数（分页）
        example: 20
        in: query
        name: $limit
        type: integer
      - description: 患者ID（ObjectId字符串）
        example: 665f0f1a2c3d4e5f6a7b8c9d
        in: query
        name: patient
        required: true
        type: string
      - description: 是否仅显示手动输入的数据（可选）
        example: true
        in: query
        name: input
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回分页血压数据
          schema:
            allOf:
            - $ref: '#/definitions/data.ReturnPageData'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.bpData'
                  type: array
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/data.ReturnData'
      security:
      - ApiKeyAuth: []
      summary: 获取血压数据列表
      tags:
      - BP
    post:
      consumes:
      - application/json
      description: 写入一条血压记录（单位：mmHg；recordTime 为 13 位毫秒时间戳）。可通过请求头 timeZone 指定时区（IANA
        名称）。
      parameters:
      - description: 时区名称（IANA，例如 America/Los_Angeles）
        example: America/Los_Angeles
        in: header
        name: timeZone
        type: string
      - description: 血压数据参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.bpDataPostParam'
      produces:
      - application/json
      responses:
        "200":
          description: 成功（message=success）
          schema:
            $ref: '#/definitions/data.ReturnData'
        "400":
          description: 参数或业务校验失败
          schema:
            $ref: '#/definitions/data.ReturnData'
      security:
      - ApiKeyAuth: []
      summary: 新增血压数据
      tags:
      - BP
  /bpData/delete:
    post:
      consumes:
      - application/json
      description: 根据ID列表批量删除血压记录
      parameters:
      - description: 删除参数，包含ids数组
        in: body
        name: body
        required: true
        schema:
          properties:
            ids:
              items:
                type: string
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 成功（message=success）
          schema:
            $ref: '#/definitions/data.ReturnData'
        "400":
          description: 参数错误或操作失败
          schema:
            $ref: '#/definitions/data.ReturnData'
      security:
      - ApiKeyAuth: []
      summary: 批量删除血压数据
      tags:
      - BP
  /chartData:
    get:
      consumes:
      - multipart/form-data
      description: 查询各种类型的chartData信息, 根据type类型不同，传入不同参数进行不同类型数据的查询，type为ecg时，Parameter只需设置eventId
      parameters:
      - default: ""
        description: 类型可为ECG、HR、RR、HRV、ACTIVITY、TEMPERATURE、SPO2、BP
        in: query
        name: type
        required: true
        type: string
      - default: ""
        description: patient ID
        in: query
        name: patient
        required: true
        type: string
      - default: ""
        description: patient Studies Id start
        in: query
        name: startPatientStudiesId
        type: string
      - default: ""
        description: patient Studies Id end
        in: query
        name: endPatientStudiesId
        type: string
      - description: query start timestamp
        in: query
        name: startTime
        type: integer
      - description: query end timestamp
        in: query
        name: endTime
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.ReturnData'
        "500":
          description: "500"
          schema:
            type: string
      security:
      - token: []
      tags:
      - chartData
  /chartData/bpm:
    get:
      consumes:
      - multipart/form-data
      description: 获取BPM信息，Page View界面数据展示使用
      parameters:
      - default: ""
        description: patient ID
        in: query
        name: patient
        required: true
        type: string
      - description: query start timestamp
        in: query
        name: startTime
        required: true
        type: integer
      - description: query end timestamp
        in: query
        name: endTime
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.ReturnData'
        "500":
          description: "500"
          schema:
            type: string
      security:
      - token: []
      tags:
      - BPM
  /chartData/bpm/ecg:
    get:
      consumes:
      - multipart/form-data
      description: 获取BPM Ecg信息，Focused View图表界面数据展示使用
      parameters:
      - default: ""
        description: patient ID
        in: query
        name: patient
        required: true
        type: string
      - description: query start timestamp
        in: query
        name: startTime
        required: true
        type: integer
      - description: query end timestamp
        in: query
        name: endTime
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.ReturnData'
        "500":
          description: "500"
          schema:
            type: string
      security:
      - token: []
      tags:
      - BPM
  /chartData/ecg/event/count:
    get:
      consumes:
      - application/json
      description: 返回所选时间范围内的多个时间点上，各类事件的计数（含颜色与 patientStudiesId 关联）。
      parameters:
      - description: 患者ID（ObjectId）
        in: query
        name: patientId
        required: true
        type: string
      - description: 起始时间戳（毫秒，13位）
        example: 1730611200000
        format: int64
        in: query
        name: startTime
        type: integer
      - description: 结束时间戳（毫秒，13位）
        example: 1730697600000
        format: int64
        in: query
        name: endTime
        type: integer
      - description: 时区名称（IANA，如 America/Los_Angeles）
        example: America/Los_Angeles
        in: query
        name: timeZoneName
        type: string
      - description: 时区偏移量（分钟，如 -420）
        example: -420
        in: query
        name: timeZoneOffset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功（data 为时间序列数组）
          schema:
            $ref: '#/definitions/app_api_chart_ecg.eventCountChartDataReturnData'
        "400":
          description: 参数或校验错误
          schema:
            $ref: '#/definitions/data.ReturnData'
      security:
      - ApiKeyAuth: []
      summary: ECG 事件计数（分时间点）
      tags:
      - ECG Charts
  /clinics:
    get:
      consumes:
      - multipart/form-data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.ReturnData'
        "500":
          description: "500"
          schema:
            type: string
      security:
      - token: []
      tags:
      - clinic
    post:
      consumes:
      - application/json
      description: 创建一个新的诊所，包括基本信息、功能开关、登录配置等
      parameters:
      - description: 诊所信息
        in: body
        name: clinic
        required: true
        schema:
          $ref: '#/definitions/clinic.clinicAddParam'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/data.ReturnData'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/data.ReturnData'
        "500":
          description: 服务器内部错误
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: 创建新诊所
      tags:
      - Clinic
  /clinics/{id}:
    get:
      description: 根据 ID 获取诊所的配置信息、能力开关、登录与安全配置等
      parameters:
      - description: Clinic ID
        example: '"66a1b2c3d4e5f60718293a4b"'
        in: path
        name: id
        required: true
        type: string
      produces:
